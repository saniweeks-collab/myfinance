<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0f0f13">
<title>我的理財</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f13;--bg2:#1a1a22;--bg3:#22222e;--b:rgba(255,255,255,0.08);--b2:rgba(255,255,255,0.15);--t:#f0f0f5;--t2:rgba(240,240,245,0.5);--t3:rgba(240,240,245,0.28);--ac:#7c6ff7;--ac2:#a89cf7;--g:#4ade9a;--r:#f06a6a;--am:#f0b96a;--mo:'DM Mono',monospace;--sa:'Noto Sans TC',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--t);font-family:var(--sa);overflow:hidden;}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* HEADER */
.hd{padding:50px 16px 12px;background:var(--bg);border-bottom:1px solid var(--b);flex-shrink:0;}
.ht{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
.htl{font-size:12px;color:var(--t2);letter-spacing:.08em;font-family:var(--mo);}
.hd2{font-size:11px;color:var(--t3);font-family:var(--mo);}
.hcards{display:flex;gap:6px;}
.hcard{flex:1;background:var(--bg2);border-radius:12px;padding:10px 9px;border:1px solid var(--b);}
.hcard.main{flex:1.4;background:linear-gradient(135deg,rgba(124,111,247,.18),rgba(124,111,247,.06));border-color:rgba(124,111,247,.3);}
.hcl{font-size:9px;color:var(--t2);margin-bottom:3px;letter-spacing:.03em;}
.hcv{font-size:16px;font-weight:700;font-family:var(--mo);}
.hcv.ac{color:var(--ac2);}
.hcv.r{color:var(--r);}
.hcv.g{color:var(--g);}
.hcs{font-size:10px;color:var(--t3);margin-top:2px;font-family:var(--mo);}

/* NAV */
.nav{display:flex;background:var(--bg);border-bottom:1px solid var(--b);flex-shrink:0;overflow-x:auto;}
.nav::-webkit-scrollbar{display:none;}
.nb{flex-shrink:0;padding:9px 10px;font-size:10px;color:var(--t3);background:none;border:none;cursor:pointer;font-family:var(--sa);position:relative;white-space:nowrap;}
.nb.on{color:var(--ac2);}
.nb.on::after{content:'';position:absolute;bottom:0;left:10%;right:10%;height:2px;background:var(--ac);border-radius:2px;}

/* PANELS */
.pls{flex:1;overflow:hidden;position:relative;}
.pl{position:absolute;inset:0;overflow-y:auto;padding:13px;display:none;-webkit-overflow-scrolling:touch;}
.pl.on{display:block;}

/* RECORD TAB */
.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.mto{padding:10px;border-radius:11px;font-size:13px;font-weight:700;border:1px solid transparent;cursor:pointer;font-family:var(--sa);text-align:center;}
.mto.exp.on{background:rgba(240,106,106,.15);color:var(--r);border-color:var(--r);}
.mto.inc.on{background:rgba(74,222,154,.15);color:var(--g);border-color:var(--g);}
.mto.off{background:var(--bg2);color:var(--t3);border-color:var(--b);}
.qg{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-bottom:9px;}
.qb{background:var(--bg2);border:1px solid var(--b);border-radius:11px;padding:8px 3px;text-align:center;cursor:pointer;}
.qb:active{transform:scale(.93);}
.qb.sl{border-color:var(--ac);background:rgba(124,111,247,.15);}
.qi{font-size:17px;margin-bottom:2px;}
.ql{font-size:9px;color:var(--t2);}
.iqg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:9px;}
.iqb{background:var(--bg2);border:1px solid var(--b);border-radius:11px;padding:10px 5px;text-align:center;cursor:pointer;font-size:11px;color:var(--t2);}
.iqb.sl{border-color:var(--g);background:rgba(74,222,154,.12);color:var(--g);font-weight:700;}
.ad{background:var(--bg2);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--b);text-align:center;}
.ah{font-size:10px;color:var(--t3);margin-bottom:4px;font-family:var(--mo);}
.av{font-size:32px;font-weight:700;font-family:var(--mo);color:var(--t);min-height:40px;letter-spacing:-1px;}
.av.hv.exp{color:var(--r);}
.av.hv.inc{color:var(--g);}
.np{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px;}
.nb2{background:var(--bg2);border:1px solid var(--b);border-radius:11px;padding:12px 6px;font-size:18px;font-family:var(--mo);color:var(--t);text-align:center;cursor:pointer;}
.nb2:active{transform:scale(.91);background:var(--bg3);}
.nb2.dl{font-size:13px;color:var(--t2);}
.note-inp{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:9px;padding:9px 12px;font-size:13px;color:var(--t);font-family:var(--sa);margin-bottom:8px;}
.note-inp::placeholder{color:var(--t3);}
.at-row{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px;}
.at-label{font-size:9px;color:var(--t3);margin-bottom:4px;font-family:var(--mo);}
.at-btns{display:flex;gap:3px;flex-wrap:wrap;}
.acb{background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:5px 7px;font-size:10px;color:var(--t2);cursor:pointer;font-family:var(--sa);}
.acb.on{background:rgba(124,111,247,.2);border-color:var(--ac);color:var(--ac2);font-weight:700;}
.tyb{background:var(--bg3);border:1px solid var(--b2);border-radius:7px;padding:5px 6px;font-size:10px;color:var(--t2);cursor:pointer;font-family:var(--sa);}
.tyb.on{background:rgba(124,111,247,.2);border-color:var(--ac);color:var(--ac2);font-weight:700;}
.ar{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px;}
.st{background:var(--bg2);border:1px solid var(--b);border-radius:11px;padding:10px;font-size:11px;color:var(--t2);text-align:center;cursor:pointer;}
.st.bfo{background:rgba(74,222,154,.1);border-color:var(--g);color:var(--g);}
.st.iow{background:rgba(240,106,106,.1);border-color:var(--r);color:var(--r);}
.cb{border:none;border-radius:11px;padding:11px;font-size:13px;font-weight:700;color:white;cursor:pointer;font-family:var(--sa);}
.cb.exp{background:var(--r);}
.cb.inc{background:var(--g);color:#0f0f13;}
.cb:active{opacity:.8;}

/* TRANSFER */
.xfer-card{background:var(--bg2);border:1px solid var(--b);border-radius:13px;padding:12px;margin-bottom:8px;}
.xfer-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.xfer-sel{flex:1;background:var(--bg3);border:1px solid var(--b2);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--t);font-family:var(--sa);-webkit-appearance:none;}
.xfer-arrow{font-size:16px;color:var(--t3);flex-shrink:0;}
.xfer-inp{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:9px;padding:9px 11px;font-size:14px;color:var(--t);font-family:var(--mo);margin-bottom:8px;}
.xfer-inp::placeholder{color:var(--t3);}
.xfer-btn{width:100%;background:var(--ac);border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;color:white;cursor:pointer;font-family:var(--sa);}

/* LIST */
.sl2{font-size:10px;color:var(--t3);letter-spacing:.07em;margin-bottom:7px;font-family:var(--mo);}
.ic{background:var(--bg2);border:1px solid var(--b);border-radius:11px;overflow:hidden;margin-bottom:7px;}
.ir{display:flex;align-items:center;padding:9px 11px;gap:7px;border-bottom:1px solid var(--b);}
.ir:last-child{border-bottom:none;}
.ii{font-size:17px;width:25px;text-align:center;flex-shrink:0;}
.iif{flex:1;min-width:0;}
.in{font-size:13px;color:var(--t);}
.im{font-size:10px;color:var(--t3);margin-top:1px;}
.irt{text-align:right;flex-shrink:0;}
.ia{font-size:13px;font-weight:500;font-family:var(--mo);}
.ia.exp{color:var(--r);}
.ia.inc{color:var(--g);}
.isp{font-size:10px;margin-top:1px;}
.isp.bf{color:var(--g);}.isp.me{color:var(--r);}
.dx{background:none;border:none;color:var(--t3);font-size:16px;padding:2px;cursor:pointer;flex-shrink:0;line-height:1;}
.arch-btn{background:var(--bg3);border:1px solid var(--b2);border-radius:8px;padding:5px 10px;font-size:10px;color:var(--t2);cursor:pointer;font-family:var(--sa);}
.arch-card{background:var(--bg2);border:1px solid var(--b);border-radius:11px;margin-bottom:6px;overflow:hidden;}
.arch-hd{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;cursor:pointer;}
.arch-title{font-size:12px;font-weight:700;color:var(--t);font-family:var(--mo);}
.arch-sub{font-size:10px;color:var(--t3);}
.arch-body{padding:9px 12px;display:none;border-top:1px solid var(--b);}
.arch-body.open{display:block;}
.arch-row{display:flex;justify-content:space-between;padding:4px 0;font-size:11px;border-bottom:1px solid var(--b);}
.arch-row:last-child{border-bottom:none;}

/* SPLIT */
.sc{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;}
.sr{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--b);}
.sr:last-child{border-bottom:none;}
.sn{font-size:13px;color:var(--t2);}
.sa2{font-size:13px;font-weight:700;font-family:var(--mo);}
.sa2.g{color:var(--g);}.sa2.r{color:var(--r);}
.bs{font-size:22px;font-weight:700;font-family:var(--mo);text-align:center;padding:14px 0;}
.sab{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:11px;padding:11px;font-size:12px;color:var(--t2);cursor:pointer;font-family:var(--sa);margin-bottom:7px;}

/* SAVINGS PLAN */
.plan-card{background:var(--bg2);border:1px solid var(--b);border-radius:13px;padding:13px;margin-bottom:9px;}
.plan-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.plan-name{font-size:14px;font-weight:700;color:var(--t);}
.plan-target{font-size:11px;color:var(--t3);}
.plan-bar-wrap{height:6px;background:var(--bg3);border-radius:3px;margin-bottom:10px;overflow:hidden;}
.plan-bar-fill{height:100%;border-radius:3px;transition:width .5s;}
.plan-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:10px;}
.plan-num{background:var(--bg3);border-radius:9px;padding:8px 9px;}
.plan-nl{font-size:9px;color:var(--t3);margin-bottom:2px;}
.plan-nv{font-size:13px;font-weight:700;font-family:var(--mo);}
.plan-nv.g{color:var(--g);}.plan-nv.am{color:var(--am);}.plan-nv.ac{color:var(--ac2);}
.plan-update{display:flex;gap:6px;margin-top:4px;}
.plan-inp{flex:1;background:var(--bg3);border:1px solid var(--b2);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--t);font-family:var(--mo);}
.plan-inp::placeholder{color:var(--t3);}
.plan-go{background:var(--ac);border:none;border-radius:9px;padding:9px 14px;font-size:12px;font-weight:700;color:white;cursor:pointer;font-family:var(--sa);}
.plan-del{background:none;border:none;color:var(--t3);font-size:13px;cursor:pointer;padding:2px 6px;}
.add-plan-card{background:var(--bg2);border:1px dashed var(--b2);border-radius:13px;padding:13px;margin-bottom:9px;}
.add-plan-inp{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--t);font-family:var(--sa);margin-bottom:7px;}
.add-plan-inp::placeholder{color:var(--t3);}
.add-plan-row{display:flex;gap:6px;margin-bottom:7px;}
.add-plan-btn{width:100%;background:var(--ac);border:none;border-radius:10px;padding:11px;font-size:13px;font-weight:700;color:white;cursor:pointer;font-family:var(--sa);}

/* INVEST */
.itc{background:var(--bg2);border:1px solid var(--b);border-radius:13px;padding:13px;margin-bottom:9px;}
.itl{font-size:10px;color:var(--t3);letter-spacing:.06em;font-family:var(--mo);margin-bottom:4px;}
.itv{font-size:26px;font-weight:700;font-family:var(--mo);color:var(--ac2);margin-bottom:10px;}
.ig{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.ibk{background:var(--bg3);border-radius:9px;padding:8px 10px;}
.ibkl{font-size:9px;color:var(--t3);margin-bottom:2px;}
.ibkv{font-size:12px;font-weight:700;font-family:var(--mo);color:var(--t);}
.ibks{font-size:9px;color:var(--t3);margin-top:2px;}
.stk{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;}
.skh{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px;}
.skc{font-size:13px;font-weight:700;font-family:var(--mo);color:var(--ac2);}
.skn{font-size:10px;color:var(--t3);margin-top:1px;}
.skp{font-size:14px;font-weight:700;font-family:var(--mo);color:var(--t);text-align:right;}
.skch{font-size:10px;margin-top:2px;font-family:var(--mo);text-align:right;}
.skch.up{color:var(--r);}.skch.dn{color:var(--g);}.skch.na{color:var(--t3);}
.sks{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:8px;}
.ss{background:var(--bg3);border-radius:7px;padding:6px 8px;}
.ssl{font-size:9px;color:var(--t3);margin-bottom:2px;}
.ssv{font-size:11px;font-weight:500;font-family:var(--mo);}
.skpl{display:flex;justify-content:space-between;align-items:center;padding-top:7px;border-top:1px solid var(--b);margin-bottom:8px;}
.pll{font-size:11px;color:var(--t2);}
.plv{font-size:12px;font-weight:700;font-family:var(--mo);}
.plv.up{color:var(--r);}.plv.dn{color:var(--g);}.plv.na{color:var(--t3);}
/* mini chart */
.minichart{width:100%;height:48px;overflow:hidden;}
.rfb{width:100%;background:var(--bg3);border:1px solid var(--b2);border-radius:10px;padding:10px;font-size:12px;color:var(--t2);cursor:pointer;font-family:var(--sa);margin-bottom:8px;}
.aiv{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:8px;}
.isl{background:var(--bg3);border:1px solid var(--b2);border-radius:9px;padding:9px 11px;font-size:12px;color:var(--t);font-family:var(--sa);width:100%;margin-bottom:6px;-webkit-appearance:none;}
.ifr{display:flex;gap:6px;margin-bottom:6px;}
.iip{flex:1;background:var(--bg3);border:1px solid var(--b2);border-radius:9px;padding:9px 11px;font-size:13px;color:var(--t);font-family:var(--mo);}
.iip::placeholder{color:var(--t3);}
.iab{width:100%;background:var(--ac);border:none;border-radius:9px;padding:10px;font-size:13px;font-weight:700;color:white;cursor:pointer;font-family:var(--sa);}
.mdb{background:var(--bg3);border:1px solid var(--b2);border-radius:8px;padding:8px 3px;font-size:10px;color:var(--t2);cursor:pointer;font-family:var(--sa);}
.mdb.on{background:rgba(124,111,247,.2);border-color:var(--ac);color:var(--ac2);font-weight:700;}
.mdb.sell{background:rgba(240,106,106,.15);border-color:var(--r);color:var(--r);}
.mdb.nnb{background:rgba(240,185,106,.15);border-color:var(--am);color:var(--am);}
.rn{font-size:10px;color:var(--t3);text-align:center;margin-bottom:8px;font-family:var(--mo);}

/* ASSET */
.pin-dot{width:11px;height:11px;border-radius:50%;background:var(--bg3);border:1px solid var(--b2);transition:background .15s;}
.pin-dot.filled{background:var(--ac);}
.pin-btn{background:var(--bg3);border:1px solid var(--b2);border-radius:11px;padding:13px;font-size:18px;font-family:var(--mo);color:var(--t);cursor:pointer;}
.pin-btn:active{transform:scale(.92);}
.pin-btn.del{font-size:13px;color:var(--t2);}
.acc-card{background:var(--bg2);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:7px;}
.acc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--b);}
.acc-row:last-child{border-bottom:none;}
.acc-name{font-size:13px;color:var(--t);}
.acc-type{font-size:10px;color:var(--t3);margin-top:1px;}
.acc-bal{font-size:14px;font-weight:700;font-family:var(--mo);color:var(--t);}

.es{text-align:center;padding:28px 16px;color:var(--t3);font-size:12px;}
.toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--bg3);border:1px solid var(--b2);border-radius:16px;padding:7px 14px;font-size:12px;color:var(--t);opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;z-index:999;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="hd">
    <div class="ht"><div class="htl">我的理財</div><div class="hd2" id="hDate"></div></div>
    <div class="hcards">
      <div class="hcard main" onclick="editBudget()" style="cursor:pointer;">
        <div class="hcl">本月預算剩餘 ✎</div>
        <div class="hcv ac" id="hRemain">—</div>
        <div class="hcs" id="hDaily">每日建議 —</div>
      </div>
      <div class="hcard">
        <div class="hcl">本月支出</div>
        <div class="hcv r" id="hExp">$0</div>
        <div class="hcs" id="hExpSub">已刷卡</div>
      </div>
    </div>
  </div>

  <!-- NAV -->
  <div class="nav">
    <button class="nb on" onclick="showTab('rec',this)">記帳</button>
    <button class="nb" onclick="showTab('list',this)">明細</button>
    <button class="nb" onclick="showTab('split',this)">分帳</button>
    <button class="nb" onclick="showTab('plan',this)">存錢計畫</button>
    <button class="nb" onclick="showTab('invest',this)">投資</button>
    <button class="nb" onclick="showTab('asset',this)">總資產</button>
  </div>

  <div class="pls">

    <!-- REC TAB -->
    <div class="pl on" id="tab-rec">
      <div class="mode-row">
        <button class="mto exp on" id="mExp" onclick="setEM('exp')">－ 支出</button>
        <button class="mto off" id="mInc" onclick="setEM('inc')">＋ 收入</button>
      </div>
      <div id="expSec"><div class="qg" id="qG"></div></div>
      <div id="incSec" style="display:none;">
        <div class="iqg" id="iqG"></div>
        <div style="margin-bottom:8px;">
          <div class="at-label">存入帳戶</div>
          <div class="at-btns" id="incAccGrid"></div>
        </div>
      </div>
      <div class="ad">
        <div class="ah">金額（TWD）</div>
        <div class="av exp" id="aD">0</div>
        <div style="font-size:11px;color:var(--t2);margin-top:3px;" id="nD">選擇類別或直接輸入</div>
      </div>
      <div class="np">
        <button class="nb2" onclick="np('1')">1</button><button class="nb2" onclick="np('2')">2</button><button class="nb2" onclick="np('3')">3</button>
        <button class="nb2" onclick="np('4')">4</button><button class="nb2" onclick="np('5')">5</button><button class="nb2" onclick="np('6')">6</button>
        <button class="nb2" onclick="np('7')">7</button><button class="nb2" onclick="np('8')">8</button><button class="nb2" onclick="np('9')">9</button>
        <button class="nb2" onclick="np('00')">00</button><button class="nb2" onclick="np('0')">0</button><button class="nb2 dl" onclick="nd()">⌫</button>
      </div>
      <input class="note-inp" id="noteInp" placeholder="備註（選填）" />
      <div class="at-row">
        <div><div class="at-label">帳戶</div><div class="at-btns" id="accGrid"></div></div>
        <div><div class="at-label">類型</div><div class="at-btns" id="typeGrid"></div></div>
      </div>
      <div id="splitRow">
        <div class="ar" id="splitBtnRow">
          <button class="st" id="sB" onclick="cS()"><div id="sL">平分設定</div><div id="sS" style="font-size:10px;margin-top:1px;opacity:.7;">點選切換</div></button>
          <button class="cb exp" id="confirmBtn" onclick="cA()">記下支出 ✓</button>
        </div>
        <div id="incConfirmRow" style="display:none;">

function dI(id){
  const item=S.items.find(i=>i.id===id);
  if(item){
    if(item.dir==='inc'&&item.acc&&S.accounts[item.acc]){
      // Reverse income: subtract from account
      S.accounts[item.acc].balance=(S.accounts[item.acc].balance||0)-item.amt;
    }
    if(item.dir==='xfer'){
      // Reverse transfer: restore from-account, deduct to-account
      const note=item.note||'';
      const arrow=note.indexOf('→');
      if(arrow>-1){
        const from=note.substring(0,arrow).trim();
        const to=note.substring(arrow+1).split(' ')[0].trim();
        if(S.accounts[from])S.accounts[from].balance=(S.accounts[from].balance||0)+item.amt;
        if(S.accounts[to])S.accounts[to].balance=(S.accounts[to].balance||0)-item.amt;
      }
    }
  }
  S.items=S.items.filter(i=>i.id!==id);
  sv();rAll();
}

function doTransfer(){
  const from=document.getElementById('xFrom').value,to=document.getElementById('xTo').value;
  const amt=parseFloat(document.getElementById('xAmt').value);
  const note=document.getElementById('xNote').value.trim();
  if(!amt||amt<=0){toast('請輸入金額');return;}

  if(S.accounts[from])S.accounts[from].balance-=amt;
  if(S.accounts[to])S.accounts[to].balance+=amt;

  document.getElementById('xAmt').value='';document.getElementById('xNote').value='';
  sv();rHd();toast('✓ 已轉帳 $'+amt.toLocaleString()+' '+from+'→'+to);
}

// HEADER
function rHd(){
  const exp=S.items.filter(i=>i.dir==='exp');
  const inc=S.items.filter(i=>i.dir==='inc');
  const bf=exp.filter(i=>i.sp==='bf').reduce((s,i)=>s+Math.round(i.amt/2),0);
  const me=exp.filter(i=>i.sp==='me').reduce((s,i)=>s+Math.round(i.amt/2),0);
  const myExp=exp.reduce((s,i)=>s+i.amt,0)-bf+me;
  const totalInc=inc.reduce((s,i)=>s+i.amt,0);
  const fi=S.fixedItems||[];
  const fixedTotal=fi.reduce((s,f)=>s+(f.amt||0),0);
  const budget=S.budget!=null?S.budget:(69172-fixedTotal);
  const remain=budget-myExp+totalInc;
  // days remaining in billing cycle (to 5/19)
  const now=new Date(),billingEnd=new Date(now.getFullYear(),now.getMonth(),19);
  if(billingEnd<now)billingEnd.setMonth(billingEnd.getMonth()+1);
  const daysLeft=Math.max(1,Math.ceil((billingEnd-now)/(864e5)));
  const daily=Math.max(0,Math.round(remain/daysLeft));
  tx('hRemain','$'+remain.toLocaleString());
  tx('hDaily','每日建議 $'+daily.toLocaleString()+' · 剩'+daysLeft+'天');
  tx('hExp','$'+myExp.toLocaleString());

async function fP(sym){try{const r=await fetch('https://api.allorigins.win/get?url='+encodeURIComponent('https://query1.finance.yahoo.com/v8/finance/chart/'+sym+'?interval=1d&range=1mo'),{signal:AbortSignal.timeout(9000)});const j=await r.json();const d=JSON.parse(j.contents);const m=d.chart.result[0].meta;const closes=d.chart.result[0].indicators?.quote?.[0]?.close||[];return{price:m.regularMarketPrice,prev:m.chartPreviousClose,hist:closes.filter(Boolean).slice(-20)};}catch(e){return null;}}

function drawChart(canvas,hist,up){
  if(!hist||hist.length<2)return;
  const W=canvas.width=canvas.offsetWidth||280,H=canvas.height=48;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,W,H);
  const mn=Math.min(...hist),mx=Math.max(...hist),rng=mx-mn||1;
  const pts=hist.map((v,i)=>({x:i/(hist.length-1)*W,y:H-(v-mn)/rng*(H-6)-3}));
  ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);pts.forEach(p=>ctx.lineTo(p.x,p.y));
  ctx.strokeStyle=up?'#f06a6a':'#4ade9a';ctx.lineWidth=1.5;ctx.stroke();
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,up?'rgba(240,106,106,.2)':'rgba(74,222,154,.2)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.closePath();ctx.fillStyle=grad;ctx.fill();
}

    const cc=chg==null?'na':chg>0?'up':'dn';const ct=chg==null?'—':(chg>0?'▲':'▼')+Math.abs(chg).toFixed(2)+'%';
    const pc=pnl==null?'na':pnl>0?'up':'dn';const pt=pnl==null?'輸入持倉查看損益':(pnl>=0?'+':'')+pnl.toLocaleString()+(pnlP!=null?' ('+(pnlP>=0?'+':'')+pnlP.toFixed(1)+'%)':'');
    const cid='chart-'+x.sym.replace(/\./g,'-');
    const up=chg==null?true:chg>0;
    const c=document.createElement('div');c.className='stk';
    c.innerHTML=`<div class="skh"><div><div class="skc">${x.sym.replace('.TW','')}</div><div class="skn">${x.nm}</div></div><div><div class="skp">${hasP?'$'+x.price.toLocaleString():'—'}</div><div class="skch ${cc}">${ct}</div></div></div><canvas class="minichart" id="${cid}"></canvas><div class="sks"><div class="ss"><div class="ssl">持股</div><div class="ssv">${x.sh||'—'}</div></div><div class="ss"><div class="ssl">均價</div><div class="ssv">${x.avg?'$'+x.avg.toLocaleString():'—'}</div></div><div class="ss"><div class="ssl">市值</div><div class="ssv">${val?'$'+val.toLocaleString():'—'}</div></div></div><div class="skpl"><span class="pll">未實現損益</span><span class="plv ${pc}">${pt}</span></div>`;
    sc.appendChild(c);
    requestAnimationFrame(()=>{const cv=document.getElementById(cid);if(cv&&x.hist&&x.hist.length>1)drawChart(cv,x.hist,up);});
  });
}

function archiveMonth(){if(!S.items||!S.items.length){toast('本月沒有紀錄');return;}const exp=S.items.filter(i=>i.dir==='exp');const inc=S.items.filter(i=>i.dir==='inc');const total=exp.reduce((s,i)=>s+i.amt,0);const bf=exp.filter(i=>i.sp==='bf').reduce((s,i)=>s+Math.round(i.amt/2),0);const me=exp.filter(i=>i.sp==='me').reduce((s,i)=>s+Math.round(i.amt/2),0);const mine=total-bf+me;const totalInc=inc.reduce((s,i)=>s+i.amt,0);const bycat={};exp.forEach(i=>{const ma=i.sp==='bf'?Math.round(i.amt/2):i.amt;bycat[i.cat]=(bycat[i.cat]||0)+ma;});const d=new Date();const label=d.getFullYear()+'/'+(d.getMonth()+1)+'月';if(!S.archives)S.archives=[];S.archives.unshift({label,total,mine,bf,me,totalInc,bycat,items:[...S.items],date:d.toLocaleDateString('zh-TW')});S.items=[];sv();rAll();rArch();toast('✓ 已封存 '+label);}

// ASSET with PIN
function rAsset(){
  const accs=S.accounts||{};

  // Credit card debt = sum of all exp items tagged 國泰信用卡 (live from items)
  const cardSpent=S.items.filter(i=>i.dir==='exp'&&i.acc==='國泰信用卡').reduce((s,i)=>s+i.amt,0);

  // US stocks in TWD
  const us=Math.round((S.usStockUsd||1995)*(S.usdRate||32));

  // All asset accounts (cash + securities)
  const cashKeys=['富邦金融卡','國泰金融卡','NNB'];
  const cashTotal=cashKeys.reduce((s,k)=>s+(accs[k]?.balance||0),0);
  const twVal=(accs['富邦證券']?.balance||0)+(accs['國泰證券']?.balance||0);

  // Gross = cash + TW securities + US stocks
  const grossAssets=cashTotal+twVal+us;

  // Net = gross - credit card (calculated live from items)
  const tot=grossAssets-cardSpent;

  tx('aTot','$'+tot.toLocaleString());

  const ac=document.getElementById('accCards');
  if(!ac)return;
  // Clear previous note if any
  const prev=document.getElementById('assetNote');if(prev)prev.remove();
  ac.innerHTML='';

  // Each account row
  Object.entries(accs).forEach(([name,info])=>{
    const bal=info.isDebt?cardSpent:(info.balance||0);
    const display=info.isDebt?(bal>0?'−$'+bal.toLocaleString():'$0'):'$'+bal.toLocaleString();
    const col=info.isDebt&&bal>0?'var(--r)':(info.color||'var(--t)');
    const r=document.createElement('div');r.className='acc-row';
    r.innerHTML=`<div><div class="acc-name">${name}</div><div class="acc-type">${info.type}</div></div><div class="acc-bal" style="color:${col};">${display}</div>`;
    ac.appendChild(r);
  });

  // US stocks row
  const ur=document.createElement('div');ur.className='acc-row';
  ur.innerHTML=`<div><div class="acc-name">美股市值</div><div class="acc-type">USD $${(S.usStockUsd||1995).toLocaleString()} × ${(S.usdRate||32).toFixed(1)}</div></div><div class="acc-bal" style="color:var(--ac2);">$${us.toLocaleString()}</div>`;
  ac.appendChild(ur);

  // Summary note
  const note=document.createElement('div');
  note.id='assetNote';
  note.style.cssText='font-size:10px;color:var(--t3);margin-top:10px;padding:10px;background:var(--bg3);border-radius:9px;font-family:var(--mo);line-height:2;';
  note.innerHTML=
    '現金/存款　$'+cashTotal.toLocaleString()+
    '<br>台股（富邦+國泰證券）　$'+twVal.toLocaleString()+
    '<br>美股　$'+us.toLocaleString()+
    '<br>國泰信用卡未繳　<span style="color:var(--r);">−$'+cardSpent.toLocaleString()+'</span>'+
    '<br><span style="color:var(--ac2);font-size:13px;font-weight:700;">淨資產　$'+tot.toLocaleString()+'</span>';
  ac.parentElement.appendChild(note);
}
